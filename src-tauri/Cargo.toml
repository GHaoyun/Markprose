[package]
name = "markprose"
version = "1.1.2"
description = "Markprose — 所见即所得的 Markdown 编辑器"
authors = ["Markprose"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "markprose_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
